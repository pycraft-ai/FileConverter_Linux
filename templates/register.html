{% extends "base.html" %}
{% block title %}注册 - 文件转化工具{% endblock %}
{% block guest_content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5 col-lg-4">
        <div class="glass-card p-4 login-card">
            <div class="text-center mb-4">
                <div class="icon-circle" style="background: linear-gradient(135deg, #00b09b, #96c93d);">
                    <i class="fas fa-user-plus fa-2x"></i>
                </div>
                <h3 class="fw-bold mt-3 gradient-text">创建账户</h3>
                <p class="text-muted">注册后即可使用全部功能</p>
            </div>
            <form method="post" action="{{ url_for('auth.register') }}">
                <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
                <div class="mb-3">
                    <label for="username" class="form-label">
                        <i class="fas fa-user me-1"></i>用户名
                    </label>
                    <div class="input-group input-group-glass">
                        <span class="input-group-text"><i class="fas fa-user"></i></span>
                        <input type="text" class="form-control" id="username"
                               name="username" value="{{ form.username }}" required autofocus placeholder="请输入用户名">
                    </div>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">
                        <i class="fas fa-envelope me-1"></i>邮箱
                    </label>
                    <div class="input-group input-group-glass">
                        <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                        <input type="email" class="form-control" id="email"
                               name="email" value="{{ form.email }}" required placeholder="请输入邮箱">
                    </div>
                </div>
                <!-- 验证码 -->
                <div class="mb-3">
                    <label for="verify_code" class="form-label">
                        <i class="fas fa-shield-alt me-1"></i>邮箱验证码
                    </label>
                    <div class="input-group">
                        <input type="text" class="form-control" id="verify_code"
                               name="verify_code" value="{{ form.verify_code }}" required placeholder="请输入6位验证码"
                               maxlength="6" pattern="\d{6}" inputmode="numeric">
                        <button type="button" class="btn" id="sendCodeBtn" data-verify-url="{{ url_for('auth.api_send_verify_code') }}"
                                style="background:#667eea;color:#fff;white-space:nowrap;font-size:13px;padding:6px 14px;">
                            获取验证码
                        </button>
                    </div>
                    <small class="text-muted" id="codeHint" style="font-size:11px;"></small>
                    <div style="font-size:11px;color:#b0b7c3;margin-top:2px;">如未收到请检查垃圾箱</div>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">
                        <i class="fas fa-key me-1"></i>密码
                    </label>
                    <div class="input-group input-group-glass">
                        <span class="input-group-text"><i class="fas fa-lock"></i></span>
                        <input type="password" class="form-control" id="password"
                               name="password" value="{{ form.password }}" required placeholder="请输入密码"
                               autocomplete="new-password">
                    </div>
                    <!-- 实时密码强度清单 -->
                    <div class="pw-check mt-2" id="pwCheck">
                        <div class="pw-item" data-rule="length"><i class="fas fa-circle"></i> 至少 8 个字符</div>
                        <div class="pw-item" data-rule="upper"><i class="fas fa-circle"></i> 包含大写字母（A-Z）</div>
                        <div class="pw-item" data-rule="lower"><i class="fas fa-circle"></i> 包含小写字母（a-z）</div>
                        <div class="pw-item" data-rule="digit"><i class="fas fa-circle"></i> 包含数字（0-9）</div>
                    </div>
                </div>
                <div class="mb-4">
                    <label for="confirm_password" class="form-label">
                        <i class="fas fa-check-circle me-1"></i>确认密码
                    </label>
                    <div class="input-group input-group-glass">
                        <span class="input-group-text"><i class="fas fa-check"></i></span>
                        <input type="password" class="form-control" id="confirm_password"
                               name="confirm_password" value="{{ form.confirm_password }}" required placeholder="请再次输入密码"
                               autocomplete="new-password">
                    </div>
                </div>
                <button type="submit" class="btn btn-gradient w-100 btn-lg"
                        style="background: linear-gradient(135deg, #00b09b, #96c93d);">
                    <i class="fas fa-user-plus me-2"></i>注册
                </button>
            </form>
            <hr class="my-4">
            <p class="text-center mb-0">
                已有账户？
                <a href="{{ url_for('auth.login') }}" class="link-gradient">
                    去登录 <i class="fas fa-arrow-right ms-1"></i>
                </a>
            </p>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/verify-code.js') }}"></script>
<script src="{{ url_for('static', filename='js/password-check.js') }}?v=2"></script>
{% endblock %}
