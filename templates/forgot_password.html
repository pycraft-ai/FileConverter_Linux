{% extends "base.html" %}
{% block title %}忘记密码 - FileConverter 文件转换工具{% endblock %}
{% block guest_content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5 col-lg-4">
        <div class="glass-card p-4 login-card">
            <div class="text-center mb-4">
                <div class="icon-circle" style="background: linear-gradient(135deg, #f59e0b, #ef4444);">
                    <i class="fas fa-unlock-alt fa-2x"></i>
                </div>
                <h3 class="fw-bold mt-3 gradient-text">重置密码</h3>
                <p class="text-muted">通过邮箱验证码重置您的密码</p>
            </div>
            <form method="post" action="{{ url_for('auth.forgot_password') }}">
                <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
                <div class="mb-3">
                    <label for="email" class="form-label">
                        <i class="fas fa-envelope me-1"></i>注册邮箱
                    </label>
                    <div class="input-group input-group-glass">
                        <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                        <input type="email" class="form-control" id="email"
                               name="email" value="{{ form.email }}" required placeholder="请输入注册时使用的邮箱">
                    </div>
                </div>
                <!-- 验证码 -->
                <div class="mb-3">
                    <label for="verify_code" class="form-label">
                        <i class="fas fa-shield-alt me-1"></i>验证码
                    </label>
                    <div class="input-group">
                        <input type="text" class="form-control" id="verify_code"
                               name="verify_code" required placeholder="请输入6位验证码"
                               maxlength="6" pattern="\d{6}" inputmode="numeric">
                        <button type="button" class="btn" id="sendCodeBtn" data-verify-url="{{ url_for('auth.api_send_verify_code') }}"
                                style="background:#f59e0b;color:#fff;white-space:nowrap;font-size:13px;padding:6px 14px;">
                            获取验证码
                        </button>
                    </div>
                    <small class="text-muted" id="codeHint" style="font-size:11px;"></small>
                    <div style="font-size:11px;color:#b0b7c3;margin-top:2px;">如未收到请检查垃圾箱</div>
                </div>
                <div class="mb-3">
                    <label for="new_password" class="form-label">
                        <i class="fas fa-key me-1"></i>新密码
                    </label>
                    <div class="input-group input-group-glass">
                        <span class="input-group-text"><i class="fas fa-lock"></i></span>
                        <input type="password" class="form-control" id="new_password"
                               name="new_password" required placeholder="请输入新密码">
                    </div>
                </div>
                <div class="mb-4">
                    <label for="confirm_password" class="form-label">
                        <i class="fas fa-check-circle me-1"></i>确认新密码
                    </label>
                    <div class="input-group input-group-glass">
                        <span class="input-group-text"><i class="fas fa-check"></i></span>
                        <input type="password" class="form-control" id="confirm_password"
                               name="confirm_password" required placeholder="请再次输入新密码">
                    </div>
                </div>
                <button type="submit" class="btn btn-gradient w-100 btn-lg"
                        style="background: linear-gradient(135deg, #f59e0b, #ef4444);">
                    <i class="fas fa-check-circle me-2"></i>重置密码
                </button>
            </form>
            <hr class="my-4">
            <p class="text-center mb-0">
                <a href="{{ url_for('auth.login') }}" class="link-gradient">
                    <i class="fas fa-arrow-left me-1"></i>返回登录
                </a>
            </p>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/verify-code.js') }}"></script>
{% endblock %}
